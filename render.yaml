services:
  - type: web
    name: fieldshift-api
    env: python
    region: oregon
    plan: free
    branch: version2
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
